[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/mixflow-db",
    "crates/mixflow-analysis",
    "crates/mixflow-recommender",
    "crates/mixflow-providers",
    "crates/mixflow-session",
]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
