[package]
name = "mixinspodj"
version = "0.1.0"
description = "MixInspo DJ — a DJ companion app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mixinspodj_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mixflow-db = { path = "../crates/mixflow-db" }
mixflow-broadcast = { path = "../crates/mixflow-broadcast" }
mixflow-analysis = { path = "../crates/mixflow-analysis" }
mixflow-recommender = { path = "../crates/mixflow-recommender" }
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.21"
walkdir = "2"
blake3 = "1"
rfd = "0.15"
printpdf = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
